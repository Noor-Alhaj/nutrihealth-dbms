{% extends "base.html" %}

{% block title %}Edit Branch - Nutri Health{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2>Edit Branch #{{ branch.Branch_ID }}</h2>
    </div>
    
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="branch_name" class="form-label">Branch Name *</label>
                <input type="text" id="branch_name" name="branch_name" 
                       class="form-control" value="{{ branch.Branch_Name }}" required>
            </div>
            
            <div class="mb-3">
                <label for="city" class="form-label">City *</label>
                <input type="text" id="city" name="city" 
                       class="form-control" value="{{ branch.City }}" required>
            </div>
            
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea id="address" name="address" class="form-control" rows="3">{{ branch.Address or '' }}</textarea>
            </div>
            
            <div class="mb-3">
                <label for="phone" class="form-label">Phone *</label>
                <input type="text" id="phone" name="phone" 
                       class="form-control" value="{{ branch.Phone }}" required>
            </div>
            
            <div class="mb-3">
                <label for="manager_id" class="form-label">Branch Manager</label>
                <select id="manager_id" name="manager_id" class="form-control">
                    <option value="">-- No Manager Assigned --</option>
                    {% for employee in employees %}
                        <option value="{{ employee.Employee_ID }}" 
                                {% if branch.Manager_ID == employee.Employee_ID %}selected{% endif %}>
                            {{ employee.Employee_Name }} - {{ employee.Position.replace('_', ' ') }}
                        </option>
                    {% endfor %}
                </select>
                <small class="form-text text-muted">
                    Select an existing employee to assign as manager. 
                    If the employee doesn't exist, <a href="{{ url_for('add_employee') }}">add them first</a>.
                </small>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Update Branch
                </button>
                <a href="{{ url_for('branches') }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-label {
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    
    .form-control:focus {
        border-color: #28a745;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
    }
    
    .d-flex {
        display: flex;
    }
    
    .gap-2 {
        gap: 0.5rem;
    }
    
    .mb-3 {
        margin-bottom: 1rem;
    }
</style>
{% endblock %}
